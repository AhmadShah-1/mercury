name: mercury
services:
  db:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: mercury
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: mercury_local
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - mercury_pgdata:/var/lib/postgresql/data
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: &app_environment
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
      RELEASE_ID: ${RELEASE_ID:-development}
      DATABASE_URL: postgresql+psycopg://mercury:mercury_local@db:5432/mercury
      AUTH_MODE: ${AUTH_MODE:-dev}
      MAIL_MODE: ${MAIL_MODE:-fake}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      SYNC_MODE: ${SYNC_MODE:-manual}
      GMAIL_LABEL_WRITES_ENABLED: ${GMAIL_LABEL_WRITES_ENABLED:-false}
      SECRET_KEY: ${SECRET_KEY:-mercury-local-fixtures-only-not-a-production-secret}
      TOKEN_ENCRYPTION_KEYS: ${TOKEN_ENCRYPTION_KEYS:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:8000"
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *app_environment
    command: ["python", "-m", "mercury.jobs.worker"]
    depends_on:
      db:
        condition: service_healthy
  test-db:
    profiles: ["test"]
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: mercury_test
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: mercury_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  mercury_pgdata:

