name: mercury
services:
  db:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_DB: mercury
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: mercury_local
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - mercury_pgdata:/var/lib/postgresql/data
  web:
    # web and worker run the same locally built image with different commands.
    image: mercury:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: &app_environment
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
      RELEASE_ID: ${RELEASE_ID:-development}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://mercury:mercury_local@db:5432/mercury
      AUTH_MODE: ${AUTH_MODE:-dev}
      MAIL_MODE: ${MAIL_MODE:-fake}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      SYNC_MODE: ${SYNC_MODE:-manual}
      GMAIL_LABEL_WRITES_ENABLED: ${GMAIL_LABEL_WRITES_ENABLED:-false}
      SECRET_KEY: ${SECRET_KEY:-mercury-local-fixtures-only-not-a-production-secret}
      TOKEN_ENCRYPTION_KEYS: ${TOKEN_ENCRYPTION_KEYS:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-}
      PUBSUB_TOPIC: ${PUBSUB_TOPIC:-}
      PUBSUB_SUBSCRIPTION: ${PUBSUB_SUBSCRIPTION:-}
      PUBSUB_PUSH_SERVICE_ACCOUNT: ${PUBSUB_PUSH_SERVICE_ACCOUNT:-}
      PUBSUB_AUDIENCE: ${PUBSUB_AUDIENCE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-gpt-4.1-mini-2025-04-14}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AI_SUMMARY_INPUT_USD_PER_MILLION: ${AI_SUMMARY_INPUT_USD_PER_MILLION:-}
      AI_SUMMARY_OUTPUT_USD_PER_MILLION: ${AI_SUMMARY_OUTPUT_USD_PER_MILLION:-}
      AI_EMBEDDING_INPUT_USD_PER_MILLION: ${AI_EMBEDDING_INPUT_USD_PER_MILLION:-}
      AI_GLOBAL_MONTHLY_BUDGET_USD: ${AI_GLOBAL_MONTHLY_BUDGET_USD:-50}
      AI_ACCOUNT_MONTHLY_BUDGET_USD: ${AI_ACCOUNT_MONTHLY_BUDGET_USD:-3}
      AI_ACCOUNT_DAILY_THREAD_LIMIT: ${AI_ACCOUNT_DAILY_THREAD_LIMIT:-100}
      AI_ONBOARDING_THREAD_LIMIT: ${AI_ONBOARDING_THREAD_LIMIT:-500}
      INDEX_MAX_THREADS: ${INDEX_MAX_THREADS:-2000}
      INDEX_LOOKBACK_DAYS: ${INDEX_LOOKBACK_DAYS:-180}
      ADDITIONAL_TRUSTED_HOSTS: ${ADDITIONAL_TRUSTED_HOSTS:-}
      PROXY_HOPS: ${PROXY_HOPS:-0}
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    image: mercury:local
    pull_policy: never
    environment: *app_environment
    command: ["python", "-m", "mercury.jobs.worker"]
    depends_on:
      db:
        condition: service_healthy
  test-db:
    profiles: ["test"]
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_DB: mercury_test
      POSTGRES_USER: mercury
      POSTGRES_PASSWORD: mercury_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  mercury_pgdata:
