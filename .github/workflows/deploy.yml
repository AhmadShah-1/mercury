name: Deploy production

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Existing or approved Azure resource-group name
        required: true
        type: string
      location:
        description: Azure region
        required: true
        default: eastus
        type: string
      registry_name:
        description: Globally unique lowercase ACR name
        required: true
        type: string
      app_hostname:
        description: Hostname of the production APP_BASE_URL (used as the probe Host header)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mercury-production
  cancel-in-progress: false

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create approved resource group
        run: >-
          az group create
          --name '${{ inputs.resource_group }}'
          --location '${{ inputs.location }}'
          --only-show-errors
      - name: Bootstrap private registry
        run: >-
          az deployment group create
          --resource-group '${{ inputs.resource_group }}'
          --template-file deploy/azure/bootstrap.bicep
          --parameters registryName='${{ inputs.registry_name }}' location='${{ inputs.location }}'
          --only-show-errors
      - name: Build locked image once in ACR
        run: >-
          az acr build
          --registry '${{ inputs.registry_name }}'
          --image mercury:${{ github.sha }}
          --file deploy/Dockerfile .
          --only-show-errors
      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          digest="$(az acr manifest show-metadata --registry '${{ inputs.registry_name }}' --name 'mercury:${{ github.sha }}' --query digest -o tsv)"
          login_server="$(az acr show --name '${{ inputs.registry_name }}' --query loginServer -o tsv)"
          echo "reference=${login_server}/mercury@${digest}" >> "$GITHUB_OUTPUT"
      - name: Pull immutable image for scanning
        run: |
          az acr login --name '${{ inputs.registry_name }}'
          docker pull '${{ steps.image.outputs.reference }}'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Deploy infrastructure and immutable revision
        run: >-
          az deployment group create
          --resource-group '${{ inputs.resource_group }}'
          --template-file deploy/azure/main.bicep
          --parameters
          registryName='${{ inputs.registry_name }}'
          location='${{ inputs.location }}'
          image='${{ steps.image.outputs.reference }}'
          dopplerToken='${{ secrets.DOPPLER_PRODUCTION_TOKEN }}'
          postgresPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}'
          appHostname='${{ inputs.app_hostname }}'
          --only-show-errors
      - name: Run controlled migrations
        shell: bash
        run: |
          set -euo pipefail
          rg='${{ inputs.resource_group }}'
          execution="$(az containerapp job start --resource-group "$rg" --name mercury-migrate --query name -o tsv --only-show-errors)"
          for _ in $(seq 1 120); do
            status="$(az containerapp job execution show --resource-group "$rg" --name mercury-migrate --job-execution-name "$execution" --query properties.status -o tsv --only-show-errors)"
            case "$status" in
              Succeeded) echo "Migration execution succeeded"; exit 0 ;;
              Failed|Stopped|Degraded) echo "Migration execution ended with status $status" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "Migration execution did not finish within 30 minutes" >&2
          exit 1
