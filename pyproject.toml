[tool.poetry]
name = "mercury-mail"
version = "0.1.0"
description = "A calm, read-only Gmail organization workspace"
authors = ["Mercury contributors"]
readme = "README.md"
packages = [{ include = "mercury" }]

[tool.poetry.dependencies]
python = "^3.12"
Flask = "3.1.3"
Flask-SQLAlchemy = "3.1.1"
Flask-Migrate = "4.1.0"
Flask-Login = "0.6.3"
Flask-WTF = "1.2.2"
Authlib = "^1.6.5"
psycopg = { version = "^3.2.10", extras = ["binary", "pool"] }
pgvector = "^0.5.0"
procrastinate = "3.9.0"
cryptography = "^50.0.0"
google-api-python-client = "^2.190.0"
google-auth = "^2.40.0"
openai = "^2.6.0"
pydantic = "^2.12.0"
beautifulsoup4 = "^4.14.0"
numpy = "^2.3.0"
scikit-learn = "^1.7.0"
Flask-Admin = "^2.0.0"
gunicorn = "^23.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.0.0"
pytest-socket = "^0.7.0"
ruff = "^0.14.0"
bandit = "^1.8.0"
pip-audit = "^2.9.0"
pytest-playwright = "^0.9.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --allow-hosts=localhost,127.0.0.1,::1"
markers = [
  "postgres: requires the disposable PostgreSQL test database",
  "live: requires explicitly supplied provider credentials",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["Assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
